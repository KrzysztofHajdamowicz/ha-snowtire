[project]
name = "ha-snowtire"
version = "0.0.0"
description = "Home Assistant custom integration: tells you when it is time to change car tires based on the weather forecast."
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant==2026.10.2",
    "pytest-homeassistant-custom-component==0.13.373",
    "pytest-cov>=7.0",
    "ruff>=0.17",
    "prek>=0.5",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "COM812",  # incompatible with formatter
    "CPY001",  # Missing copyright notice (headers kept where they matter)
    "D203",    # no-blank-line-before-class (incompatible with formatter)
    "D212",    # multi-line-summary-first-line (incompatible with formatter)
    "E501",    # line too long (formatter handles it)
    "FIX002",  # TODO provide context for future work
    "ISC001",  # incompatible with formatter
    "PLR2044", # Line with empty comment
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link in TODO
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "ANN001",  # Missing type annotation for function argument
    "ANN201",  # Missing return type annotation for public function
    "ARG001",  # Unused function argument (fixtures)
    "PLR2004", # Magic value used in comparison
    "S101",    # Use of assert
    "S311",    # Standard pseudo-random generators
    "SLF001",  # Private member accessed
    "TC001",   # Type-checking imports (fixtures need runtime imports)
    "TC002",   # Type-checking imports (fixtures need runtime imports)
    "TC003",   # Type-checking imports (fixtures need runtime imports)
]
"scripts/*" = [
    "T201",    # print found
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".git", "testing_config"]
asyncio_mode = "auto"
markers = ["regression: scenarios identified during the pre-release code review"]
addopts = "--strict-markers --cov=custom_components --cov-report=term-missing"
log_format = "%(asctime)s.%(msecs)03d %(levelname)-8s %(threadName)s %(name)s:%(filename)s:%(lineno)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
source = ["custom_components"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
show_missing = true
fail_under = 90
