---
name: "Release"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  release:
    name: "Publish new release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v7

      - working-directory: ./custom_components
        run: |
          echo "package=$(ls -F | grep \/$ | sed -n "s/\///g;1p")" >> $GITHUB_ENV
          echo "release_version=$(git describe --tags)" >> $GITHUB_ENV
      - working-directory: ./custom_components
        run: |
          echo "basedir=$(pwd)/${{ env.package }}" >> $GITHUB_ENV

      - name: "Zip component dir"
        if: env.release_version != '' && success()
        working-directory: ./custom_components/${{ env.package }}
        run: |
          zip ${{ env.package }}.zip -r ./

      - name: "Release"
        if: env.release_version != '' && success()
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.basedir }}/${{ env.package }}.zip
          # Tags such as v2.0.0-pre1, v2.0.0-beta.1, v2.1.0-alpha or v2.1.0-rc1
          # are published as pre-releases (hidden in HACS unless "show beta" is on).
          prerelease: >-
            ${{ contains(github.ref_name, '-pre') || contains(github.ref_name, '-beta')
            || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}

  release-notes:
    name: "Compose release notes"
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: |
          echo "release_version=$(git describe --tags)" >> $GITHUB_ENV

      - name: "Set up uv"
        if: env.release_version != '' && success()
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: "Update release notes"
        if: env.release_version != '' && success()
        run: uv run --only-group release python ./scripts/gen_releasenotes --token ${{ secrets.GITHUB_TOKEN }} --repo ${{ github.repository }} --release ${{ env.release_version }}
